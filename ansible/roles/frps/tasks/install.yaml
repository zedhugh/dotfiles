---
- name: 创建 frp 安装目录
  file:
    path: "{{ frps_install_dir }}"
    state: directory
    mode: '0755'

# 压缩包下载与解压都在控制机本地完成（见 vars/main.yaml 的
# frps_tmp_dir），本地已有该版本的压缩包时跳过这两步
- name: 检查本地是否已有该版本的压缩包
  stat:
    path: "{{ frps_local_archive }}"
  register: local_archive
  delegate_to: localhost
  run_once: true

- name: 下载 frp 压缩包到本地
  get_url:
    url: "{{ frps_download_url }}"
    dest: "{{ frps_local_archive }}"
    timeout: 60
  delegate_to: localhost
  run_once: true
  become: false
  when: not local_archive.stat.exists

- name: 解压 frp 压缩包到本地
  unarchive:
    src: "{{ frps_local_archive }}"
    dest: "{{ frps_tmp_dir }}"
    creates: "{{ frps_local_tmp_dir }}"
  delegate_to: localhost
  run_once: true
  become: false
  when: not local_archive.stat.exists

- name: 复制 frps 二进制文件到目标机器
  copy:
    src: "{{ frps_local_tmp_dir }}/frps"
    dest: "{{ frps_install_dir }}/frps"
    mode: '0755'
  notify: restart frps
