---
# role 内部常量，非配置项：vars 优先级高于 playbook/inventory 变量，
# 引用方不能（也不应）覆盖；端口、token 等配置变量（frps_bind_port 等）
# 必填、无默认值，由引用方 playbook 提供

# 固定安装的 frp 版本（amd64），升级时更新版本号即可；本地缓存
# （frps_tmp_dir）中已有旧版本压缩包时不影响新版本下载，但可手动清理
frps_version: "0.71.1"
frps_download_url: "https://github.com/fatedier/frp/releases/download/v{{ frps_version }}/frp_{{ frps_version }}_linux_amd64.tar.gz"

# 控制机上的缓存目录（本 role 自己的 tmp/，与其他 role 的缓存隔离，
# 仓库 .gitignore 的 tmp/ 规则不锚定路径，此处同样不会误提交）：
# 压缩包下载与解压都在本地完成后拷贝到目标机，目标机无需访问 GitHub
frps_tmp_dir: "{{ role_path }}/tmp"
frps_local_archive: "{{ frps_tmp_dir }}/frp_{{ frps_version }}_linux_amd64.tar.gz"
frps_local_tmp_dir: "{{ frps_tmp_dir }}/frp_{{ frps_version }}_linux_amd64"

frps_install_dir: /opt/frp
frps_config_dir: /etc/frp
