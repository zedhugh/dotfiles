---
# role 内部常量，非配置项：vars 优先级高于 playbook/inventory 变量，
# 引用方不能（也不应）覆盖，保证任务与 systemd unit 使用同一套路径；
# 站点相关配置在 templates/app.ini.j2，不在这里

# 固定安装的 Gitea 版本（amd64），升级时更新版本号即可；sha256 不在此
# 写死，安装时从 "{{ gitea_download_url }}.sha256" 获取
gitea_version: 28.2.0
gitea_download_url: https://dl.gitea.com/gitea/{{ gitea_version }}/gitea-{{ gitea_version }}-linux-amd64

gitea_binary: /usr/local/bin/gitea
gitea_user: git
# git 用户的 home，与 Gitea 工作目录是两个路径，勿混用
gitea_home: /home/git
# Gitea 工作目录（app.ini 的 WORK_PATH）
gitea_work_path: /var/lib/gitea
gitea_conf_dir: /etc/gitea

# 备份相关路径，全部放 git 用户 home（见 tasks/backup.yaml 与
# templates/gitea-backup.*.j2）：dump 先落到本地 backup 目录，上传
# 成功才删、失败留作积压下次补传；WebDAV 与数据库凭据都放 env 文件
# 由脚本 source，不渲染进脚本和 unit，明文密码只在一处
gitea_backup_dir: "{{ gitea_home }}/backup"
gitea_backup_env_file: "{{ gitea_home }}/gitea-backup.env"
gitea_backup_script: "{{ gitea_home }}/gitea-backup"
