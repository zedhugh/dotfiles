---
- name: 创建配置目录
  file:
    path: "{{ gitea_conf_dir }}"
    state: directory
    owner: root
    group: git
    mode: '0750'

- name: 创建工作与数据目录
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ gitea_user }}"
    group: "{{ gitea_user }}"
    mode: '0750'
  loop:
    - "{{ gitea_work_path }}"
    - "{{ gitea_work_path }}/custom"
    - "{{ gitea_work_path }}/data"
    - "{{ gitea_work_path }}/log"

# app.ini 已写明全部密钥且 INSTALL_LOCK=true，Gitea 启动时不会再改动
# 它，按官方文档在安装后收紧为 root:git 只读
- name: 部署 app.ini
  template:
    src: app.ini.j2
    dest: "{{ gitea_conf_dir }}/app.ini"
    owner: root
    group: git
    mode: '0640'
  notify: restart gitea

- name: 部署 systemd unit
  template:
    src: gitea.service.j2
    dest: /etc/systemd/system/gitea.service
    owner: root
    group: root
    mode: '0644'
  notify: restart gitea

- name: 确保 Gitea 服务已启动并开机自启
  systemd:
    name: gitea
    enabled: true
    state: started
