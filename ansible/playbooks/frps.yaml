---
- name: 配置 frps 服务端
  hosts: vps_debian
  gather_facts: false
  become: true

  vars_files:
    - ../vars/vault.yaml

  vars:
    # role 的配置变量必填、无默认值，统一在此从 vault 赋值，role 内
    # 不出现 vault_ 前缀
    frps_bind_port: "{{ vault_frps_bind_port }}"
    frps_vhost_http_port: "{{ vault_frps_vhost_http_port }}"
    frps_token: "{{ vault_frps_token }}"
    frps_dashboard_port: "{{ vault_frps_dashboard_port }}"
    frps_dashboard_user: "{{ vault_frps_dashboard_user }}"
    frps_dashboard_password: "{{ vault_frps_dashboard_password }}"

  roles:
    - role: frps
