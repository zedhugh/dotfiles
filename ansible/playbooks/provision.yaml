---
- name: 新机器初始化
  hosts: vps_debian
  gather_facts: true

  vars:
    ansible_user: root

    admin_user: zedhugh
    timezone: Asia/Shanghai

  roles:
    - role: bbr

    - role: sshd
      vars:
        sshd_admin_user: "{{ admin_user }}"
        sshd_port: 22
        sshd_public_key_path: ~/.ssh/id_rsa.pub

    - role: sudo
      vars:
        sudo_user: "{{ admin_user }}"

  tasks:
    - name: 设置时区
      timezone:
        name: "{{ timezone }}"

    - name: 创建管理员用户
      user:
        name: "{{ admin_user }}"
        shell: /bin/bash
        create_home: true
        state: present
