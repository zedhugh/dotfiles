---
- name: 新机器初始化
  hosts: vps_debian
  gather_facts: yes

  vars:
    ansible_user: root
    ansible_ssh_port: 22

    admin_user: zedhugh
    # sshd role 的 sshd_admin_user 默认 root；sudo_user 是 sudo role
    # 的必填变量（无默认值），二者统一指定为管理员用户
    sshd_admin_user: "{{ admin_user }}"
    sudo_user: "{{ admin_user }}"
    # sshd role 的 sshd_port 默认 22，本仓库机器统一用 44444
    sshd_port: 44444
    timezone: Asia/Shanghai

  roles:
    - role: bbr
    - role: sshd
    - role: sudo

  tasks:
    - name: 设置时区
      timezone:
        name: "{{ timezone }}"

    - name: 创建管理员用户
      user:
        name: "{{ admin_user }}"
        shell: /bin/bash
        create_home: yes
        state: present
